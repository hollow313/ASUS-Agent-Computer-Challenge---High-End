services:
  demo:
    image: holloow313/asus-agent-computer-challenge-high-end:latest
    build: .
    container_name: agent-computer-demo
    # UID/GID 568 : applications NAS (TrueNAS SCALE). Le Dockerfile crée déjà cet
    # utilisateur ; cette ligne force le runtime à tourner avec, même sur une
    # image construite ailleurs.
    user: "568:568"
    ports:
      - "8080:8080"
    environment:
      # Mode live : pointez vers un endpoint compatible OpenAI.
      # Par défaut, la démo reste en replay déterministe (aucun modèle requis).
      AGENTDEMO_LLM_BASE_URL: "${AGENTDEMO_LLM_BASE_URL:-http://ollama:11434/v1}"
      AGENTDEMO_LLM_MODEL: "${AGENTDEMO_LLM_MODEL:-qwen2.5-coder:7b}"
      AGENTDEMO_ALLOW_NETWORK: "${AGENTDEMO_ALLOW_NETWORK:-0}"
      AGENTDEMO_DATA_DIR: /data
    volumes:
      # Seul dossier à monter : /data (runs, journaux, procédures).
      # Volume nommé, rien à préparer :
      - demo-data:/data
      # Ou un dossier de l'hôte, à condition qu'il appartienne au UID 568 :
      # - /mnt/<pool>/apps/agent-computer-demo:/data
    restart: unless-stopped

  # Décommentez ce service (et `docker compose --profile ollama up`) pour
  # tester le mode live entièrement hors ligne, sans clé API.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   profiles: ["ollama"]
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama:/root/.ollama

volumes:
  demo-data:
  # ollama:
