name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Nom d'image imposé en minuscules (GHCR refuse les majuscules du nom de dépôt)
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/asus-agent-computer-challenge-high-end

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Suite de tests
        run: python -m unittest discover -s tests -v
      - name: Les trois scénarios en ligne de commande
        run: |
          for scenario in cyber-brief inbox-triage dataset-report; do
            python -m agentdemo run --scenario "$scenario"
          done

  docker:
    name: image Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags et labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: fumée (conteneur réel)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image localement
        run: docker build -t agent-computer-demo:ci .
      - name: Démarrer le conteneur
        run: docker run -d --name demo -p 8080:8080 agent-computer-demo:ci
      - name: Vérifier /healthz puis lancer un run
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          RUN_ID=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"scenario":"cyber-brief","mode":"replay"}' \
            http://localhost:8080/api/run | python3 -c 'import json,sys;print(json.load(sys.stdin)["run_id"])')
          echo "run: $RUN_ID"
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS "http://localhost:8080/api/runs/$RUN_ID" | python3 -c 'import json,sys;print(json.load(sys.stdin)["status"])')
            [ "$STATUS" = "done" ] && break
            sleep 1
          done
          echo "statut final: $STATUS"
          [ "$STATUS" = "done" ]
          curl -fsS "http://localhost:8080/api/artifacts/$RUN_ID/briefing.md" | head -3
      - name: Nettoyage
        if: always()
        run: docker rm -f demo || true
