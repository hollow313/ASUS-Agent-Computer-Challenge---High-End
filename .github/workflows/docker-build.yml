name: Build and Publish Agent Computer Demo

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Nom d'image volontairement fixé en minuscules : le nom du dépôt contient des
  # majuscules et des tirets triples, ce qui donnerait une adresse illisible.
  IMAGE_NAME: asus-agent-computer-challenge-high-end

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Suite de tests
        run: python -m unittest discover -s tests -v
      - name: Les quatre scénarios en ligne de commande
        run: |
          for scenario in cyber-brief inbox-triage dataset-report self-repair; do
            python -m agentdemo run --scenario "$scenario"
          done

  build-and-push:
    name: image Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: fumée (conteneur réel)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image localement
        run: docker build -t agent-computer-demo:ci .
      - name: Démarrer le conteneur
        run: docker run -d --name demo -p 8080:8080 agent-computer-demo:ci
      - name: Vérifier /healthz puis lancer un run
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          RUN_ID=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"scenario":"cyber-brief","mode":"replay"}' \
            http://localhost:8080/api/run | python3 -c 'import json,sys;print(json.load(sys.stdin)["run_id"])')
          echo "run: $RUN_ID"
          STATUS=pending
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS "http://localhost:8080/api/runs/$RUN_ID" | python3 -c 'import json,sys;print(json.load(sys.stdin)["status"])')
            [ "$STATUS" = "done" ] && break
            sleep 1
          done
          echo "statut final: $STATUS"
          [ "$STATUS" = "done" ]
          curl -fsS "http://localhost:8080/api/artifacts/$RUN_ID/briefing.md" | head -3
      - name: Nettoyage
        if: always()
        run: docker rm -f demo || true
